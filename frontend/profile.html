<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | University Answer Evaluator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">UAE</div>
          <div>
            <h2>Answer Evaluator</h2>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main">
          <a href="dashboard.html" class="nav-item" data-page="dashboard">Dashboard</a>
          <a href="create-evaluation.html" class="nav-item" data-page="create-evaluation">New Evaluation</a>
          <a href="history.html" class="nav-item" data-page="history">History</a>
          <a href="profile.html" class="nav-item active" data-page="profile">Profile</a>
        </nav>

        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <h1>University Answer Evaluator</h1>
          <a href="profile.html" class="profile-link" aria-label="Open profile">
            <span id="profileAvatar" class="avatar">U</span>
          </a>
        </header>

        <main class="content-area">
          <section class="card form-card">
            <div class="page-heading">
              <p class="eyebrow">Account</p>
              <h2>Profile</h2>
            </div>

            <form id="profileForm" class="stacked-form" novalidate>
              <div class="field-group">
                <label for="profileName">Name</label>
                <input id="profileName" type="text" name="name" />
              </div>

              <div class="field-group">
                <label for="profileEmail">Email</label>
                <input id="profileEmail" type="email" name="email" />
              </div>

              <div class="profile-actions">
                <button type="submit" class="primary-btn">Save Changes</button>
                <button type="button" id="profileLogoutBtn" class="secondary-btn">Logout</button>
              </div>
              <div id="profileMessage" class="form-message" aria-live="polite"></div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
