<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | University Answer Evaluator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <span class="auth-badge">Create Account</span>
          <h1>Register</h1>
          <p>Set up your evaluation account</p>
        </div>

        <form id="registerForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="registerName">Full Name</label>
            <input id="registerName" name="fullName" type="text" placeholder="Enter your full name" required />
          </div>

          <div class="field-group">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" name="email" type="email" placeholder="Enter your email" required />
          </div>

          <div class="field-group">
            <label for="registerPassword">Password</label>
            <input id="registerPassword" name="password" type="password" placeholder="Create a password" required />
          </div>

          <div class="field-group">
            <label for="registerConfirmPassword">Confirm Password</label>
            <input id="registerConfirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" required />
          </div>

          <button type="submit" id="registerBtn" class="primary-btn full-width">Create Account</button>
          <div id="registerMessage" class="form-message" aria-live="polite"></div>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a href="login.html">Login</a>
        </p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
