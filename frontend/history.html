<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History | University Answer Evaluator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">UAE</div>
          <div>
            <h2>Answer Evaluator</h2>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main">
          <a href="dashboard.html" class="nav-item" data-page="dashboard">Dashboard</a>
          <a href="create-evaluation.html" class="nav-item" data-page="create-evaluation">New Evaluation</a>
          <a href="history.html" class="nav-item active" data-page="history">History</a>
          <a href="profile.html" class="nav-item" data-page="profile">Profile</a>
        </nav>

        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <h1>University Answer Evaluator</h1>
          <a href="profile.html" class="profile-link" aria-label="Open profile">
            <span id="profileAvatar" class="avatar">U</span>
          </a>
        </header>

        <main class="content-area">
          <section class="card table-card">
            <div class="section-header">
              <h3>Evaluation History</h3>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Examination</th>
                    <th>Subject</th>
                    <th>Semester</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Score</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="historyTableBody">
                  <tr>
                    <td colspan="7" class="empty-state">No evaluation history found.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/history.js"></script>
  </body>
</html>
