<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Evaluation | University Answer Evaluator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/evaluation.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">UAE</div>
          <div>
            <h2>Answer Evaluator</h2>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main">
          <a href="dashboard.html" class="nav-item" data-page="dashboard">Dashboard</a>
          <a href="create-evaluation.html" class="nav-item active" data-page="create-evaluation">New Evaluation</a>
          <a href="history.html" class="nav-item" data-page="history">History</a>
          <a href="profile.html" class="nav-item" data-page="profile">Profile</a>
        </nav>

        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <h1>University Answer Evaluator</h1>
          <a href="profile.html" class="profile-link" aria-label="Open profile">
            <span id="profileAvatar" class="avatar">U</span>
          </a>
        </header>

        <main class="content-area">
          <section class="card form-card">
            <div class="page-heading">
              <p class="eyebrow">Create</p>
              <h2>Create New Evaluation</h2>
            </div>

            <form id="createEvaluationForm" class="stacked-form" novalidate>
              <div class="field-group">
                <label for="evaluationName">Examination Name</label>
                <input id="evaluationName" name="evaluationName" type="text" placeholder="Test Examination" required />
              </div>

              <div class="field-group">
                <label for="evaluationSubject">Subject</label>
                <input id="evaluationSubject" name="subject" type="text" placeholder="Software Engineering" required />
              </div>

              <div class="field-group">
                <label for="evaluationSemester">Semester</label>
                <input id="evaluationSemester" name="semester" type="text" placeholder="7th Semester" required />
              </div>

              <div class="field-group">
                <label for="totalMarks">Total Marks</label>
                <input id="totalMarks" name="totalMarks" type="number" min="1" placeholder="50" required />
              </div>

              <button type="submit" id="createEvaluationBtn" class="primary-btn">Create Evaluation</button>
              <div id="evaluationMessage" class="form-message" aria-live="polite"></div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/evaluation.js"></script>
  </body>
</html>
